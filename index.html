a thứ mình làm ra.`},work:{label:`Dự án chọn lọc`,view:`Xem`,more:`Đọc thêm về dự án`,next:`Dự án tiếp theo`,close:`Đóng`},archive:{label:`Còn lại`,note:`Những thứ nhỏ hơn, làm cho khách, hoặc làm chỉ vì tò mò. Vài dự án riêng tư tôi không kể ở đây.`,rows:vp([`Tấm Shop`,`HanziFlow`,`ChannelForge Studio`,`Tử Vi AI`,`Zombie LifeSim`,`Whispeer`,`Flutter Setup Guide`,`Hơn hai mươi app tập luyện`],[`Quản lý cho thuê, thanh toán Pay2S`,`Học tiếng Trung, kho âm thanh gần 10.000 từ`,`Công cụ desktop vận hành kênh YouTube`,`Lập và luận lá số`,`Game mô phỏng sinh tồn, thử sức với game loop`,`Nhắn tin thời gian thực`,`Ghi chép cài đặt cho người mới`,`Đọc sách, thời tiết, tin tức, rạp phim, todo…`])},about:{label:`Về tôi`,lines:[`Chậm mà chắc,`,`như *cây lớn*`,`từng vòng gỗ.`],paras:[`Tôi viết Flutter lâu nhất. Năm nay tôi chuyển hẳn sang Swift và SwiftUI cho các app iOS, và Jetpack Compose khi cần một bản Android riêng. Phía sau thường là Go hoặc Node, dữ liệu nằm ở Postgres, SQLite hay Firebase tuỳ bài toán. Web thì Next.js.`,`Thứ tôi giỏi nhất có lẽ là đưa một sản phẩm đi hết đường: qua được khâu kiểm duyệt của Apple và Google, xử lý thanh toán trong app, chứng chỉ, chính sách, ảnh chụp màn hình — những việc không ai thích làm nhưng thiếu thì app không bao giờ ra đời.`],journey:[[`2022`,`Viết những dòng code đầu tiên. Chưa biết mình sẽ đi xa đến đâu.`],[`2023`,`Gặp Flutter và ở lại. Làm liên tục các app nhỏ để học — phần lớn vẫn nằm trên GitHub.`],[`2024`,`Sổ thu mua cua đi vào vận hành. Lần đầu tiên phần mềm của tôi có người dùng hằng ngày.`],[`2025`,`SmartMeal AI được Apple duyệt. App đầu tiên mang tên tôi trên App Store.`],[`2026`,`Phát hành Học Tiếng Tiều, DoneDrop, Peapod, Ganba và Hiyoko. Ba app sau cùng viết hoàn toàn bằng Swift.`],[`2028`,`Dự định mở một studio nhỏ làm app và game ở TP.HCM.`]]},play:{label:`Thử ngay`,title:`Đừng chỉ xem ảnh, *chạm thử*.`,note:`Ba tương tác đặc trưng của Hiyoko, Peapod và Ganba, dựng lại bằng HTML để bạn bấm thử ngay trên trang. Đây là bản demo, không phải app thật.`},ledger:{label:`Đã phát hành`,title:`Mỗi lần lên store là *một con dấu*.`,note:`Ngày lên store lần đầu và phiên bản hiện tại. Google Play không công khai ngày đầu tiên nên DoneDrop chỉ ghi năm.`,first:`Lên store`,current:`Hiện tại`,next:`Đang trên đường`,nextItems:[`Peapod 1.1 — chặn app bằng Screen Time`,`Ganba cho Android`,`Nuni HSK`]},footer:{lines:[`Mình cùng`,`làm *gì đó* nhé`],write:`Viết cho tôi`,copied:`Đã chép địa chỉ email`,version:`Phiên bản`,time:`Giờ ở Việt Nam`,storeName:`Tên trên App Store`},projects:{hiyoko:{name:`Hiyoko`,kind:`App Store`,linkLabel:`Xem trên App Store`,lead:`App học tiếng Nhật cho người bắt đầu từ con số không: từ Hiragana, Katakana tới lộ trình N5–N1, có chú gà con Hiyo đi cùng.`,body:[`Hiyoko dạy trước rồi mới hỏi: chữ nào chưa học luôn có romaji bên cạnh, kana mở dần theo từng bài, và không bao giờ có câu hỏi về thứ bạn chưa gặp. Mỗi vòng chỉ 3–4 phút.`,`Thẻ đã học đi vào lịch ôn FSRS với các mức nhớ có tên rõ ràng; nghỉ lâu quay lại thì app chỉ đưa vài thẻ trước khi học tiếp. Có giải đấu theo tuần và hai khiên giữ chuỗi ngày.`,`Hiyoko và Ganba chung một repo và một Swift package cho nội dung, đồng bộ và lịch ôn. Ở bản 2.0 tôi bỏ RevenueCat, thanh toán chỉ còn qua StoreKit của Apple, và có test khẳng định app không còn mang SDK đó.`],facts:[[`Vai trò`,`Một mình — app, nội dung, backend, phát hành`],[`Nền tảng`,`iOS 17+`],[`Công nghệ`,`SwiftUI, FSRS, StoreKit 2, Go`],[`Phiên bản`,`2.0.3 · phát hành 17/10/2026`]],features:[{title:`Vòng học 3–4 phút`,text:`Bản đồ bài học đi từ kana tới N5–N1. Nút Tiếp tục gộp thẻ đến hạn, một vòng mới và phần thêm, nên bước tiếp theo luôn rõ ràng.`},{title:`Lật thẻ, đóng dấu hanko`,text:`Chạm để lật thẻ 3D, vuốt phải để đóng dấu khi đã nhớ. Một lớp sương che cách đọc; lau đi để xem trộm thì tính là chưa nhớ hẳn.`},{title:`Viết từng nét, được chấm điểm`,text:`Hiragana, Katakana và kanji: viết từng nét, app báo nét nào đúng, gần đúng hay cần xem lại.`},{title:`Nhìn thấy ngữ điệu`,text:`Từ nào có dữ liệu cao độ thì đường lên xuống hiện ngay trên thẻ, kèm giọng đọc của người bản xứ.`}]},ganba:{name:`Ganba`,kind:`App Store`,linkLabel:`Xem trên App Store`,lead:`App luyện thi JLPT từ N5 đến N1: làm đề thi thử, biết mình còn thiếu bao nhiêu điểm để đậu, rồi luyện đúng phần đang kéo điểm xuống.`,body:[`Ganba mở đầu bằng một bài kiểm tra 8 câu trong khoảng ba phút, ước tính điểm rồi lên lịch học tới ngày thi. Hơn 200 đề luyện theo đúng định dạng JLPT, tính giờ từng phần như thi thật, phần nghe có âm thanh, làm dở thoát ra vẫn giữ nguyên bài.`,`Mọi tiến độ nằm trong SQLite trên máy, không cần tài khoản; đăng nhập bằng Apple chỉ để đồng bộ nếu muốn. Server không nằm trên đường học: mất mạng vẫn làm đề, vẫn mua gói Pro, vẫn mở khoá.`,`Phần khó nhất là nội dung. Câu hỏi do AI soạn phải qua kiểm tra chéo của hai mô hình khác nhau mới được xuất bản, lời giải do AI viết được gắn nhãn ngay trong app, và pipeline tự chặn mọi tài nguyên chưa rõ quyền sử dụng.`,`Bản 1.1 ra hai tuần sau: thêm các bộ đề ngắn theo chủ đề, sổ câu sai có ghi chú và bộ lọc, nghe lặp một đoạn A–B, và làm riêng một phần thi có tính giờ. Bản Android đang được viết bằng Jetpack Compose.`],facts:[[`Vai trò`,`Một mình — iOS, Android, backend, pipeline nội dung`],[`Nền tảng`,`iOS 17+ · Android đang phát triển`],[`Công nghệ`,`SwiftUI, GRDB, FSRS, StoreKit 2, Go, Jetpack Compose`],[`Phiên bản`,`1.1.0 · 5,0 sao trên App Store`]],features:[{title:`Biết hôm nay cần làm gì`,text:`Màn Hôm nay đếm ngược tới ngày thi, cho biết điểm ước tính và còn thiếu bao nhiêu điểm để đậu, kèm một nhiệm vụ 5, 10 hoặc 20 phút.`},{title:`Đề thi thử đúng định dạng`,text:`Hàng trăm đề từ N5 tới N1, tính giờ từng phần như thi thật. Thoát giữa chừng vẫn giữ nguyên bài làm.`},{title:`Điểm theo từng phần`,text:`Nộp bài là có điểm ước tính kèm khoảng dao động, cảnh báo phần sắp chạm điểm liệt và việc nên làm tiếp theo.`},{title:`Luyện đúng chỗ yếu`,text:`Luyện theo dạng câu hỏi, sổ câu sai, thẻ ôn tập và nghe chép chính tả — mỗi buổi 5, 10 hoặc 20 phút.`}]},tieu:{name:`Học Tiếng Tiều`,kind:`App Store`,linkLabel:`Xem trên App Store`,lead:`App học tiếng Triều Châu cho người Việt. Tôi làm nó vì gần như không tìm được tài liệu học tiếng Tiều nào viết bằng tiếng Việt.`,body:[`Phần khó nhất không nằm ở code mà ở dữ liệu. Tiếng Tiều hầu như không có nguồn nào chuẩn hoá sẵn, nên tôi phải tự gom từng mục từ, đối chiếu phiên âm Peng'im và ghép với giọng đọc bản xứ. Đến giờ kho dữ liệu có khoảng 6.000 mục từ và 4.600 bản ghi âm.`,`App chạy được hoàn toàn khi không có mạng. Dữ liệu nằm trong SQLCipher, file âm thanh được mã hoá riêng — công sức thu thập quá lớn để ai đó chép đi trong một buổi chiều. Lịch ôn tập dùng thuật toán SM-2, có thêm widget ngoài màn hình chính để mỗi ngày nhìn thấy một câu.`,`Người dùng có thể báo lỗi, góp cách đọc ở vùng của họ. Mọi đóng góp đi qua một trang quản trị tôi viết riêng trước khi vào app.`],facts:[[`Vai trò`,`Một mình — dữ liệu, thiết kế, app, backend, phát hành`],[`Nền tảng`,`iOS`],[`Công nghệ`,`Flutter, SQLCipher, Supabase, Python`],[`Phiên bản`,`1.2.0 · 5,0 sao trên App Store`]],features:[{title:`Mỗi ngày một bài ngắn`,text:`Mở app là thấy ngay bài tiếp theo và một câu nói thường ngày, có chữ Hán, phiên âm và giọng đọc. Năm phút là xong.`},{title:`471 bài, chia năm cấp`,text:`Lộ trình đi từ chào hỏi, số đếm, gia đình rồi mới tới hội thoại dài.`},{title:`Từ điển hai chiều`,text:`Gõ tiếng Việt ra tiếng Tiều và ngược lại. Có cả bộ thành ngữ, họ người Tiều, món ăn Triều Châu, và những từ tiếng Việt miền Tây mượn từ tiếng Tiều.`},{title:`Tám thanh điệu, nghe là hiểu`,text:`Mỗi mục từ có giọng người bản xứ, chú thích thanh điệu và cách biến điệu khi đứng trong câu — thứ mà sách vở thường bỏ qua.`}]},meal:{name:`SmartMeal AI`,kind:`App Store`,linkLabel:`Xem trên App Store`,lead:`Chọn những thứ đang có trong bếp, app gợi ý món nấu được ngay. Đây là app đầu tiên tôi đưa lên App Store.`,body:[`Từ bản 2.0 tôi đổi hướng sang offline trước: một thư viện công thức nằm sẵn trong máy lo phần lớn công việc, nên app vẫn dùng tốt khi không có mạng. AI chỉ còn là lớp tuỳ chọn cho ai cần thêm.`,`Tôi cũng bỏ SDK thanh toán bên thứ ba và tự viết lại bằng StoreKit 2, phần xác thực biên nhận chạy trên Cloudflare Workers. Tốn công hơn, nhưng đổi lại tôi hiểu rõ từng giao dịch đi qua hệ thống của mình.`],facts:[[`Vai trò`,`Một mình — sản phẩm, app, backend, thanh toán`],[`Nền tảng`,`iOS`],[`Công nghệ`,`Flutter, StoreKit 2, Cloudflare Workers, D1`],[`Phiên bản`,`2.1 · 5,0 sao trên App Store`]],features:[{title:`Bắt đầu từ thứ đang có`,text:`Chạm vào trứng, đậu hũ, cơm nguội — app đưa ra món làm được trong ba mươi phút, kèm từng bước nấu.`},{title:`Lưu lại món đã ưng`,text:`Công thức, kế hoạch tuần và lịch sử nấu nướng nằm chung một chỗ, không cần tài khoản, không cần mạng.`},{title:`Danh sách đi chợ tự gộp`,text:`Lên kế hoạch cả tuần xong, app gom nguyên liệu theo quầy hàng và ước tính luôn số tiền.`},{title:`Cả nhà dùng chung`,text:`Tối đa mười hai hồ sơ thành viên, mỗi người một khẩu vị và chế độ ăn. Tủ bếp dùng chung để biết thứ gì sắp hết.`}]},drop:{name:`DoneDrop`,kind:`Google Play`,linkLabel:`Xem trên Google Play`,lead:`App theo dõi thói quen, nhưng mỗi lần hoàn thành bạn phải chụp một tấm ảnh làm chứng và gửi cho người đồng hành.`,body:[`Đánh dấu "đã xong" thì dễ tự dối mình, còn gửi ảnh cho một người bạn thì không. Ảnh chỉ chia sẻ riêng tư trong nhóm nhỏ, không có bảng tin công khai.`,`App viết một lần cho cả Android, iOS và macOS, có widget ngoài màn hình chính và phần xử lý ảnh chạy trên một backend Python riêng. Bản Android đã có trên Google Play, bản iOS đang chuẩn bị.`],facts:[[`Vai trò`,`Một mình — sản phẩm, app, media backend`],[`Nền tảng`,`Android · iOS đang chuẩn bị`],[`Công nghệ`,`Flutter, Firebase, Fastlane, Python`],[`Phiên bản`,`1.1.1 trên Google Play`]]},pea:{name:`Peapod`,kind:`App Store`,linkLabel:`Xem trên App Store`,lead:`Hẹn giờ tập trung kèm một hạt đậu nhỏ lớn dần theo từng phút bạn giữ được. Miễn phí, không cần đăng nhập.`,body:[`Peapod là app đầu tiên tôi viết hoàn toàn bằng SwiftUI thay vì Flutter, vì tôi muốn chặn app gây xao nhãng bằng Screen Time API — thứ chỉ làm được từ native và phải chia thành nhiều app extension chạy riêng.`,`Quyền Family Controls phải chờ Apple duyệt riêng, và lúc nộp bản 1.0 thì chưa có. Tôi đã dựng sẵn một target "chỉ hẹn giờ" cùng bundle id, không cần quyền đó, để app vẫn lên đúng hạn. Một ngày sau Apple cấp quyền; bản 1.1 có chặn app thật và giao diện tiếng Việt đã sẵn sàng.`,`Focus Duo cho hai người ghép cặp bằng một mã mời, không cần tài khoản: thấy hạt đậu của nhau, cổ vũ nhau và giữ chung một chuỗi ngày. Backend Go chỉ biết một mã thiết bị ẩn danh.`],facts:[[`Vai trò`,`Một mình — iOS native, backend, game design`],[`Nền tảng`,`iOS 17+`],[`Công nghệ`,`SwiftUI, FamilyControls, WidgetKit, Go`],[`Phiên bản`,`1.0 trên App Store · 1.1 có chặn app đang chuẩn bị`]],features:[{title:`Một hạt đậu lớn theo từng phút`,text:`Mỗi phiên tập trung làm hạt đậu lớn thêm, từ hạt giống tới Golden Pod. Bỏ cuộc giữa chừng thì đậu buồn một tiếng, vậy thôi.`},{title:`Vườn và bộ sưu tập`,text:`Đậu lớn hết cỡ thì đem trồng và ấp một hạt bí ẩn — tám loại đậu từ thường tới huyền thoại để sưu tầm.`},{title:`Thống kê không khoá sau paywall`,text:`Số phút mỗi ngày, tỷ lệ hoàn thành, giờ tập trung tốt nhất, thời gian đã dành cho việc gì — tất cả miễn phí và nằm trên máy.`},{title:`Chọn việc, chọn độ nghiêm`,text:`Ghi một việc cần làm, chọn từ 15 đến 120 phút. Ở chế độ Khó, rời app quá 30 giây là mất phiên.`}]},nuni:{name:`Nuni HSK`,kind:`Web & mobile`,lead:`Nền tảng luyện thi HSK gồm web, app di động và backend viết bằng Go.`,body:[`Dự án dài hơi nhất của tôi tính tới giờ. Tôi dựng một design system riêng trước khi viết màn hình đầu tiên, để web và app dùng chung một bộ quy tắc.`,`Phần tôi tâm đắc là đồng bộ tiến độ giữa các thiết bị: làm bài dở trên điện thoại, mở máy tính ra làm tiếp, không mất câu nào kể cả khi rớt mạng giữa chừng.`],facts:[[`Vai trò`,`Full-stack`],[`Nền tảng`,`Web, iOS, Android`],[`Công nghệ`,`Next.js, TypeScript, Flutter, Go, PostgreSQL`],[`Trạng thái`,`Đang phát triển`]]},crab:{name:`Sổ thu mua cua`,kind:`Doanh nghiệp`,lead:`Phần mềm cho một cơ sở thu mua cua: cân, tính tiền, in phiếu ngay tại chỗ. Sản phẩm đầu tiên của tôi được dùng trong công việc hằng ngày.`,body:[`Hệ thống gồm một app cho người đứng cân, một app quản trị để xem sổ sách và chỉnh bảng giá, cùng một backend ở giữa. Phiếu in ra từ máy in nhiệt.`,`Làm phần mềm cho người không ngồi bàn giấy dạy tôi nhiều điều: thao tác phải thật ít, chữ phải thật to, và dữ liệu thì không được phép mất — nên tôi làm thêm phần sao lưu theo từng phần cho những bộ dữ liệu lớn.`],facts:[[`Vai trò`,`Full-stack — hai app và backend`],[`Nền tảng`,`Android, iOS`],[`Công nghệ`,`Flutter, Node.js, MongoDB`],[`Trạng thái`,`Vận hành từ 2024`]]}}},en:{nav:{work:`Work`,about:`About`,contact:`Contact`,menu:`Menu`},hero:{lines:[`I build apps,`,`from a rough *idea*`,`to the store shelf.`],sub:`Flutter and iOS developer. Five apps on the App Store, one on Google Play, and a few more on the way.`,place:`Currently working in Da Nang`,sr:`Vuong Hy Khang — independent app developer`},intro:{label:`A few words`,text:`I wrote my first line of code in 2022 and have barely taken a day off since. I like owning a product end to end: the idea, the design, the app, the backend, the store listing, and the support inbox afterwards. Working alone is slow, but I get to know every corner of what I make.`},work:{label:`Selected work`,view:`View`,more:`Read the full story`,next:`Next project`,close:`Close`},archive:{label:`Everything else`,note:`Smaller things, client work, or things I built out of curiosity. A few private projects are left out.`,rows:vp([`Tam Shop`,`HanziFlow`,`ChannelForge Studio`,`Tu Vi AI`,`Zombie LifeSim`,`Whispeer`,`Flutter Setup Guide`,`Twenty-odd practice apps`],[`Rental management with Pay2S payments`,`Chinese learning, audio for nearly 10,000 words`,`Desktop tool for running a YouTube channel`,`Vietnamese astrology charts, read by AI`,`Survival sim — my first go at a game loop`,`Real-time messaging`,`Setup notes for newcomers`,`Books, weather, news, cinema, todos…`])},about:{label:`About`,lines:[`Slow and steady,`,`like a *tree* adding`,`one ring a year.`],paras:[`Flutter is what I have written longest. This year I moved my iOS apps to Swift and SwiftUI, and use Jetpack Compose when an app needs its own Android build. Behind them there is usually Go or Node, with Postgres, SQLite or Firebase depending on the job. On the web I use Next.js.`,`What I am probably best at is getting a product all the way out the door: app review at Apple and Google, in-app payments, certificates, policies, screenshots — the work nobody enjoys, and without which no app ever ships.`],journey:[[`2022`,`First lines of code. No idea yet how far this would go.`],[`2023`,`Found Flutter and stayed. Built small apps non-stop to learn — most are still on GitHub.`],[`2024`,`The crab ledger went into daily use. My first software with people relying on it.`],[`2025`,`SmartMeal AI approved by Apple. My first app on the App Store under my own name.`],[`2026`,`Shipped Learn Teochew, DoneDrop, Peapod, Ganba and Hiyoko. The last three are written entirely in Swift.`],[`2028`,`The plan: a small app and game studio in Ho Chi Minh City.`]]},play:{label:`Try it`,title:`Don't just look, *tap*.`,note:`The signature interactions of Hiyoko, Peapod and Ganba, rebuilt in HTML so you can try them right here. These are demos, not the real apps.`},ledger:{label:`Shipped`,title:`Every release is *a stamp*.`,note:`First store release and current version. Google Play does not publish the first release date, so DoneDrop shows the year only.`,first:`First release`,current:`Current`,next:`On the way`,nextItems:[`Peapod 1.1 — app blocking with Screen Time`,`Ganba for Android`,`Nuni HSK`]},footer:{lines:[`Let's make`,`*something* together`],write:`Write to me`,copied:`Email address copied`,version:`Version`,time:`Local time`,storeName:`App Store name`},projects:{hiyoko:{name:`Hiyoko`,kind:`App Store`,linkLabel:`View on the App Store`,lead:`Japanese for people starting from zero: from Hiragana and Katakana to the N5–N1 path, with a chick named Hiyo beside you.`,body:[`Hiyoko teaches before it tests: every character you have not learned comes with romaji beside it, kana unlock lesson by lesson, and you are never asked about something you have not met. Each round takes 3–4 minutes.`,`Learned cards go into an FSRS review schedule with named memory stages; after a break, the app brings back just a few cards before you continue. There is a weekly league and two streak shields.`,`Hiyoko and Ganba share a repository and a Swift package for content, sync and reviews. In 2.0 I removed RevenueCat so purchases go through Apple's StoreKit alone, with a test that asserts the SDK is gone.`],facts:[[`Role`,`Solo — app, content, backend, release`],[`Platform`,`iOS 17+`],[`Stack`,`SwiftUI, FSRS, StoreKit 2, Go`],[`Version`,`2.0.3 · released 17 October 2026`]],features:[{title:`Rounds of 3–4 minutes`,text:`A lesson map runs from kana to N5–N1. Continue combines due reviews, a new round and an optional extra, so the next step is always clear.`},{title:`Flip a card, stamp a hanko`,text:`Tap to flip a 3D card, swipe right to stamp it when you remember. A fog hides the reading; wipe it away to peek and it counts as not fully remembered.`},{title:`Write every stroke, get a score`,text:`Hiragana, Katakana and kanji: write each stroke and see which ones are right, close, or need another look.`},{title:`See the pitch`,text:`Words with pitch data show the high-low line right on the card, with native-speaker audio.`}]},ganba:{name:`Ganba`,kind:`App Store`,linkLabel:`View on the App Store`,lead:`JLPT prep from N5 to N1: take a mock test, see how many points you still need to pass, then practise the parts pulling your score down.`,body:[`Ganba opens with an eight-question check that takes about three minutes, estimates your score and plans your study up to exam day. Over 200 practice tests follow the JLPT format, timed section by section like the real exam, with audio for listening, and you can leave mid-test without losing answers.`,`All progress lives in SQLite on the device, with no account; Sign in with Apple is only there if you want sync. The server is never on the learning path: offline you can still take tests, buy Pro and unlock content.`,`The hard part is the content. AI-drafted questions must pass a cross-check by two different models before they are published, AI-written explanations are labelled in the app, and the pipeline blocks any asset whose usage rights are unclear.`,`Version 1.1 followed two weeks later: short sets by topic, a mistake log with notes and filters, A–B looping of listening clips, and single timed sections. An Android version is being written in Jetpack Compose.`],facts:[[`Role`,`Solo — iOS, Android, backend, content pipeline`],[`Platform`,`iOS 17+ · Android in development`],[`Stack`,`SwiftUI, GRDB, FSRS, StoreKit 2, Go, Jetpack Compose`],[`Version`,`1.1.0 · 5.0 stars on the App Store`]],features:[{title:`Know what to do today`,text:`The Today screen counts down to exam day, shows your estimated score and how many points you still need, with a 5, 10 or 20 minute mission.`},{title:`Mock tests in the real format`,text:`Hundreds of tests from N5 to N1, timed section by section like the real exam. Leave halfway and your answers are kept.`},{title:`Scores by section`,text:`Submit and get an estimated score with a range, a warning when a section is near its minimum, and what to do next.`},{title:`Practise where you are weak`,text:`Practice by question type, a mistake log, review cards and dictation — in 5, 10 or 20 minute sessions.`}]},tieu:{name:`Learn Teochew`,kind:`App Store`,linkLabel:`View on the App Store`,lead:`A Teochew language course for Vietnamese speakers. I built it because there was almost nothing written in Vietnamese for learning Teochew.`,body:[`The hard part was never the code, it was the data. Teochew has next to no standardised sources, so I collected entries one by one, checked them against Peng'im romanisation and paired them with native recordings. The corpus now holds about 6,000 entries and 4,600 recordings.`,`The app works fully offline. Data lives in SQLCipher and the audio is encrypted separately — too much work went into collecting it to have it copied in an afternoon. Reviews run on the SM-2 algorithm, and a home-screen widget shows one sentence a day.`,`Learners can report mistakes and contribute the way words are said where they live. Every contribution goes through an admin console I wrote before it reaches the app.`],facts:[[`Role`,`Solo — data, design, app, backend, release`],[`Platform`,`iOS`],[`Stack`,`Flutter, SQLCipher, Supabase, Python`],[`Version`,`1.2.0 · 5.0 stars on the App Store`]],features:[{title:`One short lesson a day`,text:`Open the app and the next lesson is right there, with an everyday sentence in characters, romanisation and audio. Five minutes and you are done.`},{title:`471 lessons, five levels`,text:`The path goes from greetings, numbers and family before it gets to longer conversations.`},{title:`A two-way dictionary`,text:`Vietnamese to Teochew and back. It also covers idioms, Teochew surnames, Teochew food, and the southern Vietnamese words borrowed from Teochew.`},{title:`Eight tones you can hear`,text:`Every entry has a native recording, tone marks, and the tone changes that happen inside a sentence — the part textbooks tend to skip.`}]},meal:{name:`SmartMeal AI`,kind:`App Store`,linkLabel:`View on the App Store`,lead:`Pick what is already in your kitchen and the app suggests what you can cook right now. This was my first app on the App Store.`,body:[`From version 2.0 I went offline-first: a recipe library on the device does most of the work, so the app stays useful without a connection. AI became an optional layer for people who want more.`,`I also dropped the third-party payment SDK and rewrote purchases on StoreKit 2, with receipt verification running on Cloudflare Workers. More effort, but now I understand every transaction that passes through my system.`],facts:[[`Role`,`Solo — product, app, backend, payments`],[`Platform`,`iOS`],[`Stack`,`Flutter, StoreKit 2, Cloudflare Workers, D1`],[`Version`,`2.1 · 5.0 stars on the App Store`]],features:[{title:`Start with what you have`,text:`Tap eggs, tofu, leftover rice — the app comes back with dishes you can make in thirty minutes, step by step.`},{title:`Keep what you liked`,text:`Recipes, weekly plans and cooking history live in one place. No account, no connection needed.`},{title:`A grocery list that merges itself`,text:`Plan the week and the app groups ingredients by aisle and estimates the bill.`},{title:`Shared by the household`,text:`Up to twelve member profiles, each with their own taste and diet. A shared pantry shows what is running low.`}]},drop:{name:`DoneDrop`,kind:`Google Play`,linkLabel:`View on Google Play`,lead:`A habit tracker with a catch: each time you finish, you take a photo as proof and send it to your accountability partner.`,body:[`Ticking a box makes it easy to lie to yourself. Sending a photo to a friend does not. Photos are shared privately within a small circle; there is no public feed.`,`One codebase covers Android, iOS and macOS, with a home-screen widget and image processing on a separate Python backend. The Android version is live on Google Play; iOS is being prepared.`],facts:[[`Role`,`Solo — product, app, media backend`],[`Platform`,`Android · iOS in preparation`],[`Stack`,`Flutter, Firebase, Fastlane, Python`],[`Version`,`1.1.1 on Google Play`]]},pea:{name:`Peapod`,kind:`App Store`,linkLabel:`View on the App Store`,lead:`A focus timer with a tiny pea that grows every minute you stay focused. Free, with no login.`,body:[`Peapod is the first app I wrote entirely in SwiftUI rather than Flutter, because I wanted to block distracting apps with the Screen Time API — which only works natively and has to be split across several app extensions.`,`The Family Controls entitlement needs a separate approval from Apple, and it had not arrived when 1.0 was due. I had already built a timer-only target on the same bundle id that does not need it, so the app shipped on time. Apple granted the entitlement a day later; version 1.1, with real app blocking and a Vietnamese interface, is ready.`,`Focus Duo pairs two people with an invite code and no accounts: you see each other's pea, cheer each other on and keep a shared streak. The Go backend only knows an anonymous device ID.`],facts:[[`Role`,`Solo — native iOS, backend, game design`],[`Platform`,`iOS 17+`],[`Stack`,`SwiftUI, FamilyControls, WidgetKit, Go`],[`Version`,`1.0 on the App Store · 1.1 with app blocking in preparation`]],features:[{title:`A pea that grows by the minute`,text:`Every focus session grows your pea, from seed to Golden Pod. Give up halfway and it is sad for an hour. That is all.`},{title:`A garden to collect`,text:`Once fully grown, plant it and hatch a mystery seed — eight peas to collect, from Common to Legendary.`},{title:`Insights without a paywall`,text:`Minutes per day, completion rate, your best time of day, where your focus went — all free and all on your iPhone.`},{title:`Pick a task, pick how strict`,text:`Name one thing to work on and choose 15 to 120 minutes. In Hard mode, leaving for 30 seconds ends the session.`}]},nuni:{name:`Nuni HSK`,kind:`Web & mobile`,lead:`An HSK exam-prep platform: a web app, a mobile app and a backend written in Go.`,body:[`My longest-running project so far. I built a design system before the first screen, so web and mobile follow one set of rules.`,`The part I am proudest of is progress sync across devices: start a test on the phone, continue on the laptop, and lose nothing even if the connection drops halfway.`],facts:[[`Role`,`Full-stack`],[`Platform`,`Web, iOS, Android`],[`Stack`,`Next.js, TypeScript, Flutter, Go, PostgreSQL`],[`Status`,`In development`]]},crab:{name:`Crab Trading Ledger`,kind:`Client work`,lead:`Software for a crab wholesaler: weigh, price and print the receipt on the spot. My first product used in day-to-day work.`,body:[`There is an app for the person at the scale, an admin app for the books and the price table, and a backend in between. Receipts come out of a thermal printer.`,`Building for people who do not sit at desks taught me a lot: as few taps as possible, big type, and data that must never be lost — so I added chunked backups for the larger datasets.`],facts:[[`Role`,`Full-stack — two apps and a backend`],[`Platform`,`Android, iOS`],[`Stack`,`Flutter, Node.js, MongoDB`],[`Status`,`In use since 2024`]]}}},zh:{nav:{work:`作品`,about:`关于`,contact:`联系`,menu:`菜单`},hero:{lines:[`我做应用，`,`从一个*想法*开始，`,`一直做到上架。`],sub:`Flutter 与 iOS 开发者。五款应用已上架 App Store，一款上架 Google Play，还有几款正在路上。`,place:`目前在岘港工作`,sr:`Vương Hỷ Khang — 独立应用开发者`},intro:{label:`几句话`,text:`我从 2022 年开始写代码，几乎没有停过一天。我喜欢把一个产品从头做到尾：自己想，自己设计，自己写应用和后端，自己上架，再自己回复用户的邮件。一个人做会慢一些，但自己做出来的东西，每个角落我都清楚。`},work:{label:`精选作品`,view:`查看`,more:`阅读完整介绍`,next:`下一个项目`,close:`关闭`},archive:{label:`其他`,note:`一些更小的东西：客户项目，或者纯粹出于好奇做的。还有几个私有项目，这里就不提了。`,rows:vp([`Tấm Shop`,`HanziFlow`,`ChannelForge Studio`,`紫微 AI`,`Zombie LifeSim`,`Whispeer`,`Flutter 安装指南`,`二十多个练手应用`],[`租赁管理，接入 Pay2S 支付`,`中文学习，近一万词的语音库`,`运营 YouTube 频道的桌面工具`,`排盘与解读`,`生存模拟游戏，第一次尝试 game loop`,`实时聊天`,`写给新手的环境配置笔记`,`读书、天气、新闻、影院、待办……`])},about:{label:`关于我`,lines:[`慢一点，稳一点，`,`像*树*一样，`,`一年长一圈。`],paras:[`我写得最久的是 Flutter。今年我的 iOS 应用全面转向 Swift 和 SwiftUI，需要单独做 Android 版时用 Jetpack Compose。后端一般是 Go 或 Node，数据按需求放在 Postgres、SQLite 或 Firebase。网页端用 Next.js。`,`我最擅长的，大概是把一个产品真正送出门：通过 Apple 和 Google 的审核、应用内支付、证书、隐私政策、商店截图——这些没人喜欢做的事，少了任何一件，应用都上不了架。`],journey:[[`2022`,`写下第一行代码。那时还不知道会走多远。`],[`2023`,`遇到 Flutter，就留了下来。为了学习不停地做小应用，大部分还放在 GitHub 上。`],[`2024`,`螃蟹收购账本投入使用。第一次有人每天依赖我写的软件。`],[`2025`,`SmartMeal AI 通过 Apple 审核。第一款署我名字的 App Store 应用。`],[`2026`,`发布「学潮州话」、DoneDrop、Peapod、Ganba 和 Hiyoko。后三款完全用 Swift 编写。`],[`2028`,`计划在胡志明市开一间小工作室，做应用和游戏。`]]},play:{label:`试一试`,title:`别只看截图，*动手点点*。`,note:`Hiyoko、Peapod 和 Ganba 的招牌交互，用 HTML 重新做了一遍，可以直接在页面上试。这些是演示，不是真正的应用。`},ledger:{label:`已发布`,title:`每次上架，*盖一个章*。`,note:`首次上架日期和当前版本。Google Play 不公开首次发布日期，所以 DoneDrop 只写年份。`,first:`首次上架`,current:`当前版本`,next:`正在路上`,nextItems:[`Peapod 1.1——用 Screen Time 屏蔽应用`,`Ganba Android 版`,`Nuni HSK`]},footer:{lines:[`一起做点`,`*有意思*的事吧`],write:`给我写信`,copied:`邮箱地址已复制`,version:`版本`,time:`越南时间`,storeName:`App Store 开发者名`},projects:{hiyoko:{name:`Hiyoko`,kind:`App Store`,linkLabel:`在 App Store 查看`,lead:`给零基础学习者的日语应用：从平假名、片假名一路走到 N5–N1，身边有一只叫 Hiyo 的小鸡陪着。`,body:[`Hiyoko 先教后考：没学过的字旁边总有罗马音，假名随课程逐步解锁，绝不会考你没见过的东西。每一轮只要 3–4 分钟。`,`学过的卡片进入 FSRS 复习计划，记忆阶段都有明确名称；隔了很久再回来，应用只先拿几张卡热身再继续。另有每周联赛和两个连续天数护盾。`,`Hiyoko 和 Ganba 共用一个仓库和一个负责内容、同步与复习的 Swift package。2.0 版我去掉了 RevenueCat，购买只走 Apple 的 StoreKit，并有测试确认应用里已不再带这个 SDK。`],facts:[[`角色`,`独立完成——应用、内容、后端、发布`],[`平台`,`iOS 17+`],[`技术`,`SwiftUI, FSRS, StoreKit 2, Go`],[`版本`,`2.0.3 · 2026 年 10 月 17 日发布`]],features:[{title:`每轮 3–4 分钟`,text:`课程地图从假名一直到 N5–N1。「继续」把到期复习、新一轮和可选加练合在一起，下一步永远清楚。`},{title:`翻卡片，盖印章`,text:`点一下翻转 3D 卡片，记住了就右滑盖章。读音被一层雾挡住，擦开偷看就算没完全记住。`},{title:`一笔一画，都有评分`,text:`平假名、片假名和汉字：每一笔写下去，应用会告诉你哪笔对了、差一点、还是需要再看看。`},{title:`看得见的音调`,text:`有音高数据的单词，高低线直接画在卡片上，并配有母语者发音。`}]},ganba:{name:`Ganba`,kind:`App Store`,linkLabel:`在 App Store 查看`,lead:`从 N5 到 N1 的 JLPT 备考应用：做一套模拟题，看清离及格还差多少分，再专门练拉低分数的部分。`,body:[`Ganba 先用大约三分钟、八道题做一次测评，估算分数，再把学习计划排到考试当天。200 多套练习题完全按 JLPT 格式，像真实考试一样分部分计时，听力配有音频，中途退出也不会丢失作答。`,`所有进度都存在设备上的 SQLite 里，不需要账号；用 Apple 登录只是为了可选的同步。服务器从不挡在学习路径上：断网时照样能做题、买 Pro、解锁内容。`,`最难的是内容。AI 起草的题目必须经过两个不同模型的交叉检查才能发布，AI 写的解析在应用里会明确标注，流水线还会自动拦下任何使用权不明的素材。`,`两周后发布了 1.1 版：按主题划分的短套题、可加笔记和筛选的错题本、听力 A–B 段循环，以及单独计时的某一部分考试。Android 版正在用 Jetpack Compose 编写。`],facts:[[`角色`,`独立完成——iOS、Android、后端、内容流水线`],[`平台`,`iOS 17+ · Android 开发中`],[`技术`,`SwiftUI, GRDB, FSRS, StoreKit 2, Go, Jetpack Compose`],[`版本`,`1.1.0 · App Store 5.0 星`]],features:[{title:`知道今天该做什么`,text:`「今天」页面倒数到考试日，显示估算分数和离及格还差几分，并给出 5、10 或 20 分钟的任务。`},{title:`真实格式的模拟考`,text:`N5 到 N1 共数百套题，像真实考试一样分部分计时。中途退出也会保留作答。`},{title:`按部分给分`,text:`交卷后给出带区间的估算分数，提醒哪个部分接近及格线，并告诉你下一步做什么。`},{title:`专攻薄弱点`,text:`按题型练习、错题本、复习卡片和听写——每次 5、10 或 20 分钟。`}]},tieu:{name:`学潮州话`,kind:`App Store`,linkLabel:`在 App Store 查看`,lead:`一款为越南人做的潮州话学习应用。做它的原因很简单：几乎找不到用越南语写的潮州话教材。`,body:[`最难的不是代码，而是数据。潮州话几乎没有现成的标准化资料，我只能一条一条收集词条，对照潮州话拼音（Peng'im），再配上母语者的录音。现在词库大约有 6,000 个词条和 4,600 条录音。`,`应用可以完全离线使用。数据存放在 SQLCipher 里，音频单独加密——这些资料花了太多功夫，不能让人一个下午就拷走。复习用的是 SM-2 算法，另外还有一个桌面小组件，每天显示一句话。`,`用户可以报错，也可以补充自己家乡的读法。所有投稿都要先经过我自己写的管理后台，才会进入应用。`],facts:[[`角色`,`独立完成——数据、设计、应用、后端、发布`],[`平台`,`iOS`],[`技术`,`Flutter, SQLCipher, Supabase, Python`],[`版本`,`1.2.0 · App Store 5.0 星`]],features:[{title:`每天一节短课`,text:`打开应用就是下一课，还有一句日常用语，附汉字、拼音和录音。五分钟就能学完。`},{title:`471 课，分五级`,text:`从问候、数字、家庭开始，再慢慢进入较长的对话。`},{title:`双向词典`,text:`越南语查潮州话，也可以反过来查。还收录了成语、潮州姓氏、潮州菜，以及越南南部从潮州话借来的词。`},{title:`八个声调，听了就懂`,text:`每个词条都有母语者录音、声调标注，以及在句子里的变调——这是课本常常略过的部分。`}]},meal:{name:`SmartMeal AI`,kind:`App Store`,linkLabel:`在 App Store 查看`,lead:`选出厨房里现有的食材，应用马上告诉你能做什么菜。这是我上架 App Store 的第一款应用。`,body:[`从 2.0 版开始我改为离线优先：设备里自带的菜谱库承担了大部分工作，没有网络也能正常使用。AI 只是留给需要的人的可选功能。`,`我还去掉了第三方支付 SDK，用 StoreKit 2 重写了购买流程，收据验证跑在 Cloudflare Workers 上。更费功夫，但每一笔经过我系统的交易，我都清清楚楚。`],facts:[[`角色`,`独立完成——产品、应用、后端、支付`],[`平台`,`iOS`],[`技术`,`Flutter, StoreKit 2, Cloudflare Workers, D1`],[`版本`,`2.1 · App Store 5.0 星`]],features:[{title:`从手边的食材开始`,text:`点一下鸡蛋、豆腐、剩饭——应用给出三十分钟内能做好的菜，并附上每一步做法。`},{title:`留下喜欢的菜`,text:`菜谱、每周计划和做菜记录都在同一个地方，不需要账号，也不需要联网。`},{title:`自动合并的购物清单`,text:`排好一周的菜单，应用会按货架把食材归类，顺便估算花费。`},{title:`全家一起用`,text:`最多十二个家庭成员档案，各有各的口味和饮食习惯。共用的储物柜会提醒你什么快用完了。`}]},drop:{name:`DoneDrop`,kind:`Google Play`,linkLabel:`在 Google Play 查看`,lead:`一款习惯打卡应用，但有个条件：每次完成都要拍一张照片作证，发给你的监督伙伴。`,body:[`勾一下「已完成」很容易骗自己，把照片发给朋友就没那么容易了。照片只在小圈子里私下分享，没有公开的动态。`,`一套代码同时支持 Android、iOS 和 macOS，有桌面小组件，图片处理由单独的 Python 后端负责。Android 版已上架 Google Play，iOS 版正在准备中。`],facts:[[`角色`,`独立完成——产品、应用、媒体后端`],[`平台`,`Android · iOS 准备中`],[`技术`,`Flutter, Firebase, Fastlane, Python`],[`版本`,`Google Play 1.1.1`]]},pea:{name:`Peapod`,kind:`App Store`,linkLabel:`在 App Store 查看`,lead:`一个专注计时器，配一颗小豆子，你每坚持一分钟它就长大一点。免费，无需登录。`,body:[`Peapod 是我第一款完全用 SwiftUI 而不是 Flutter 写的应用，因为我想用 Screen Time API 屏蔽让人分心的应用——这只能在原生环境做，而且要拆成好几个独立的 App Extension。`,`Family Controls 权限需要 Apple 单独审批，1.0 提交时还没批下来。我事先做好了一个同 bundle id、不需要该权限的「仅计时」target，所以应用按时上架。一天后 Apple 批准了权限；带真正应用屏蔽和越南语界面的 1.1 版已经准备好。`,`Focus Duo 用一个邀请码让两个人配对，不需要账号：互相看到对方的豆子、互相打气、一起保持连续天数。Go 后端只知道一个匿名的设备 ID。`],facts:[[`角色`,`独立完成——原生 iOS、后端、游戏设计`],[`平台`,`iOS 17+`],[`技术`,`SwiftUI, FamilyControls, WidgetKit, Go`],[`版本`,`App Store 1.0 · 带应用屏蔽的 1.1 准备中`]],features:[{title:`一分钟一分钟长大的豆子`,text:`每次专注都让豆子长大一点，从种子长到金豆荚。中途放弃，豆子会难过一小时，仅此而已。`},{title:`可以收集的花园`,text:`豆子长满后种下去，孵出一颗神秘种子——从普通到传说，一共八种豆子可以收集。`},{title:`不设付费墙的统计`,text:`每天的分钟数、完成率、最佳专注时段、时间花在了哪里——全部免费，全部留在你的 iPhone 上。`},{title:`选一件事，选严格程度`,text:`写下要做的一件事，选 15 到 120 分钟。困难模式下，离开应用超过 30 秒就算失败。`}]},nuni:{name:`Nuni HSK`,kind:`网页与移动端`,lead:`HSK 备考平台：网页、移动应用，以及用 Go 写的后端。`,body:[`这是我到目前为止做得最久的项目。在写第一个页面之前，我先搭了一套设计系统，让网页和应用遵循同一套规则。`,`我最满意的是跨设备同步进度：手机上做到一半，打开电脑接着做，就算中途断网也不会丢一道题。`],facts:[[`角色`,`全栈`],[`平台`,`Web, iOS, Android`],[`技术`,`Next.js, TypeScript, Flutter, Go, PostgreSQL`],[`状态`,`开发中`]]},crab:{name:`螃蟹收购账本`,kind:`企业项目`,lead:`给一家螃蟹收购商做的软件：称重、算钱、当场打印单据。这是我第一个被用在日常工作里的产品。`,body:[`系统包括一个给称重人员用的应用、一个查看账目和调整价格表的管理应用，以及中间的后端。单据由热敏打印机打出。`,`给不坐办公室的人做软件，让我学到很多：操作要尽量少，字要足够大，数据绝对不能丢——所以我另外做了针对大数据集的分块备份。`],facts:[[`角色`,`全栈——两个应用和后端`],[`平台`,`Android, iOS`],[`技术`,`Flutter, Node.js, MongoDB`],[`状态`,`2024 年起投入使用`]]}}}},bp={vi:{hiyoko:[`SwiftUI, khoảng 85.000 dòng Swift viết tay (không tính dữ liệu và file sinh tự động), chủ yếu ở bài học, thiết kế, dịch vụ và giữ chân người học`,`Dùng chung với Ganba một Swift package cho nội dung, đồng bộ và lịch ôn; hai app cùng khoảng 77.000 dòng test`,`Lịch ôn FSRS với các mức nhớ có tên; khi người học nghỉ lâu, chỉ đưa lại vài thẻ trước khi học tiếp`,`Thẻ lật 3D với cử chỉ vuốt để đóng dấu hanko, và một lớp sương che cách đọc có thể lau bằng ngón tay`,`Viết kana và kanji trên canvas, chấm điểm từng nét; đường cao độ hiển thị ngay trên thẻ từ`,`Bỏ RevenueCat ở bản 2.0, chỉ dùng StoreKit 2; một test khẳng định app không còn mang khoá hay SDK của dịch vụ đó`],ganba:[`SwiftUI, khoảng 59.000 dòng Swift cho app và 20.000 dòng trong một Swift package dùng chung với Hiyoko (không tính file sinh tự động)`,`Tiến độ lưu offline trong SQLite qua GRDB; Sign in with Apple chỉ để đồng bộ, không bắt buộc`,`Ôn thẻ từ vựng và kanji bằng FSRS; StoreKit 2 cho gói Pro; widget đếm ngược ngày thi`,`Chế độ thi giữ màn hình sáng và tính giờ từng phần như thi thật; làm dở thoát ra vẫn giữ bài`,`Câu hỏi AI soạn phải qua kiểm tra chéo hai mô hình; pipeline có cổng chặn tài nguyên chưa rõ quyền sử dụng`,`Backend Go với pgx và goose, khoảng 13.000 dòng; gói nội dung xuất lên Cloudflare R2`,`Bản Android viết bằng Jetpack Compose, khoảng 18.000 dòng Kotlin`],tieu:[`Flutter với Provider, khoảng 20.000 dòng Dart chia 10 module`,`Từ điển nằm trong SQLCipher AES-256; âm thanh mã hoá AES-GCM trong container KXA1 tự định nghĩa, tên file ràng buộc làm AAD`,`Một khoá gốc tách thành hai mảnh XOR, HKDF-SHA256 sinh khoá riêng cho cơ sở dữ liệu và âm thanh`,`Pipeline Python năm bước: dữ liệu thô → ngữ pháp → hội thoại → SQLite → mã hoá; đây là đường build duy nhất lên store`,`Script kiểm tra bảo mật mở file IPA/AAB đã build, thấy SQLite hay MP3 chưa mã hoá là chặn phát hành`,`Supabase cho cộng đồng, gói nội dung OTA tải qua URL ký có hạn 10 phút`],meal:[`Flutter với GetX, dữ liệu offline trong sqflite`,`StoreKit 2 trực tiếp, không RevenueCat: app gửi JWS của Apple lên Cloudflare Worker, Worker đối chiếu với root CA của Apple rồi mới ghi sổ`,`Sổ giao dịch và tín dụng AI trong D1, hạn mức trong KV; giao dịch chỉ kết thúc sau khi D1 xác nhận`,`Tín dụng AI được giữ chỗ phía server và chỉ trừ khi thao tác thành công; luồng offline không bao giờ tốn tín dụng`,`Nếu thiếu cấu hình proxy trong bản phát hành, thanh toán đóng lại nhưng toàn bộ tính năng offline vẫn chạy`,`Script release_audit chạy 12 cửa kiểm tra: phân tích, unit test, dữ liệu offline, smoke test proxy, privacy manifest, metadata`],drop:[`Flutter với GetX: 193 file Dart, khoảng 45.000 dòng, 31 màn hình`,`Firebase Auth (Google, Apple), Firestore với rules và index kèm trong repo, App Check, Crashlytics`,`Backend media riêng bằng Python trên Render, xác thực bằng Firebase ID token, giới hạn 15 MB mỗi ảnh`,`Fastlane tạo sản phẩm IAP và giá theo quốc gia trên Play Console bằng code thay vì bấm tay`,`Repository trả về Result/Failure thay vì ném exception`,`Ảnh chứng minh nén ngay trên máy; chia sẻ riêng tư qua mã QR`],pea:[`SwiftUI, khoảng 12.000 dòng Swift; XcodeGen sinh project với 7 target`,`Bốn app extension: DeviceActivityMonitor, ShieldConfiguration, ShieldAction và Widget (WidgetKit + Live Activity)`,`Shield được bật hai lần, trong app và từ extension, vì intervalDidStart có thể trễ vài giây`,`Trạng thái dùng chung qua App Group và JSON, không CoreData, vì extension chỉ có khoảng 6 MB bộ nhớ`,`Backend Go chỉ dùng net/http và SQLite thuần Go, một image khoảng 15 MB trên Fly.io`,`Tự xác thực App Store Server Notifications v2 bằng thư viện chuẩn; đồng hồ nhảy quá 5 phút thì phiên bị coi là bỏ dở`,`Target "chỉ hẹn giờ" cùng bundle id, không cần quyền Family Controls — phương án dự phòng giúp bản 1.0 lên đúng hạn`,`Focus Duo ghép cặp bằng mã mời 8 ký tự; API ghép cặp giới hạn 20 lần thử mỗi phút trên mỗi IP`],nuni:[`Go 1.26 với chi và pgx trên PostgreSQL, khoảng 30.000 dòng, hơn 20 migration goose`,`Web Next.js 16 và React 19 với 56 route; app Flutter với flutter_bloc, khoảng 45.000 dòng`,`Lịch ôn tập FSRS thay vì SM-2; autosave kiểu CAS với nộp bài idempotent, có E2E mô phỏng hai thiết bị`,`Design token và asset sinh ra cho cả React lẫn Dart, bước verify thất bại nếu hai bên lệch nhau`,`Mỗi bản phát hành kèm verification.json ghi log test và hash build`,`Prometheus cho metrics, MinIO cho file, Firebase Admin cho xác thực`],crab:[`Node/Express trên MongoDB; JWT kết hợp bảng key-token xoay theo thiết bị`,`Ngày làm việc tính từ 6 giờ sáng đến 6 giờ sáng hôm sau theo giờ Việt Nam, xuyên suốt mọi báo cáo`,`Tự sao lưu phía MongoDB trước mọi thao tác xoá; bảng tham chiếu không bao giờ bị xoá`,`Module analytics tách rời, xuất báo cáo HTML, Excel và Word từ cùng cơ sở dữ liệu`,`Hai app Flutter với GetX: một cho người đứng cân, một cho quản trị`]},en:{hiyoko:[`SwiftUI, about 85,000 hand-written lines of Swift (data and generated files excluded), mostly lessons, design, services and retention`,`Shares a Swift package with Ganba for content, sync and reviews; the two apps carry about 77,000 lines of tests`,`FSRS reviews with named memory stages; after a long break only a few cards come back before new work`,`3D flip cards with a swipe-to-stamp hanko gesture and a fog over the reading that you wipe away with a finger`,`Kana and kanji written on a canvas and scored stroke by stroke; pitch lines drawn right on the word card`,`Dropped RevenueCat in 2.0 for StoreKit 2 alone; a test asserts the app no longer ships its key or SDK`],ganba:[`SwiftUI, about 59,000 lines of Swift in the app plus 20,000 in a Swift package shared with Hiyoko (generated files excluded)`,`Progress stored offline in SQLite via GRDB; Sign in with Apple only for optional sync`,`Vocabulary and kanji reviews on FSRS; StoreKit 2 for Pro; an exam-countdown widget`,`Exam mode keeps the screen awake and times each section like the real test; leaving mid-test keeps your answers`,`AI-drafted questions must pass a cross-check by two models; the pipeline gates any asset with unclear usage rights`,`Go backend on pgx and goose, about 13,000 lines; content packs exported to Cloudflare R2`,`An Android version in Jetpack Compose, about 18,000 lines of Kotlin`],tieu:[`Flutter with Provider, about 20,000 lines of Dart across 10 modules`,`Dictionary in SQLCipher AES-256; audio encrypted with AES-GCM in a custom KXA1 container, filename bound as AAD`,`One master key split into two XOR shares; HKDF-SHA256 derives separate keys for the database and the audio`,`Five-step Python pipeline: raw data → grammar → dialogues → SQLite → encryption; the only sanctioned path to a store build`,`A security audit opens the built IPA/AAB and fails the release if it finds unencrypted SQLite or MP3`,`Supabase for the community; OTA content packs served through 10-minute signed URLs`],meal:[`Flutter with GetX, offline data in sqflite`,`StoreKit 2 directly, no RevenueCat: the app sends Apple's JWS to a Cloudflare Worker, which checks it against Apple's root CAs before recording it`,`Transaction and AI-credit ledgers in D1, quotas in KV; a purchase is only finished after D1 accepts it`,`AI credits are reserved server-side and charged only on success; offline flows never spend credits`,`If the proxy config is missing in a release build, payments fail closed while every offline feature keeps working`,`A release_audit script runs 12 gates: analysis, unit tests, offline data, proxy smoke tests, privacy manifest, metadata`],drop:[`Flutter with GetX: 193 Dart files, about 45,000 lines, 31 screens`,`Firebase Auth (Google, Apple), Firestore with rules and indexes checked in, App Check, Crashlytics`,`A separate Python media backend on Render, authenticated with Firebase ID tokens, 15 MB per upload`,`Fastlane provisions Play Console IAP products and per-country prices from code instead of by hand`,`Repositories return Result/Failure values instead of throwing`,`Proof photos are compressed on device; private sharing works over QR codes`],pea:[`SwiftUI, about 12,000 lines of Swift; XcodeGen generates a 7-target project`,`Four app extensions: DeviceActivityMonitor, ShieldConfiguration, ShieldAction and a Widget (WidgetKit + Live Activity)`,`The shield is armed twice, in-app and from the extension, because intervalDidStart can lag by seconds`,`Shared state via App Group and JSON, no CoreData, because extensions get roughly 6 MB of memory`,`A Go backend on net/http and pure-Go SQLite, one ~15 MB image on Fly.io`,`App Store Server Notifications v2 verified with the standard library; a clock jump over 5 minutes marks a session abandoned`,`A timer-only target on the same bundle id, without the Family Controls entitlement — the fallback that let 1.0 ship on time`,`Focus Duo pairs with an 8-character invite code; the join endpoint is rate-limited to 20 tries per minute per IP`],nuni:[`Go 1.26 with chi and pgx on PostgreSQL, about 30,000 lines, 20+ goose migrations`,`Next.js 16 and React 19 web with 56 routes; a Flutter app on flutter_bloc, about 45,000 lines`,`FSRS scheduling instead of SM-2; CAS-based autosave with idempotent submissions, exercised by a two-device E2E script`,`Design tokens and assets generated into both React and Dart, with a verify step that fails on drift`,`Every release ships with a verification.json recording test logs and build hashes`,`Prometheus for metrics, MinIO for files, Firebase Admin for auth`],crab:[`Node/Express on MongoDB; JWT paired with a per-device rotating key-token table`,`The business day runs 06:00 to 06:00 Vietnam time, honoured across every report`,`An automatic MongoDB-side backup before any delete; reference collections can never be deleted`,`A decoupled analytics module renders HTML, Excel and Word reports from the same database`,`Two Flutter apps on GetX: one for the scale operator, one for the owner`]},zh:{hiyoko:[`SwiftUI，约 85,000 行手写 Swift（不含数据和自动生成的文件），主要是课程、设计、服务和留存模块`,`与 Ganba 共用负责内容、同步和复习的 Swift package；两款应用合计约 77,000 行测试`,`FSRS 复习，记忆阶段有明确名称；长时间没学，回来时只先拿几张卡热身`,`3D 翻转卡片，右滑盖 hanko 印章；读音上蒙一层雾，用手指擦开`,`在画布上书写假名和汉字，逐笔评分；音高线直接画在单词卡上`,`2.0 版去掉 RevenueCat，只用 StoreKit 2；有测试确认应用不再携带其密钥或 SDK`],ganba:[`SwiftUI，应用约 59,000 行 Swift，另有约 20,000 行在与 Hiyoko 共用的 Swift package 中（不含自动生成的文件）`,`进度离线存于 SQLite（GRDB）；Apple 登录仅用于可选同步`,`词汇和汉字复习用 FSRS；Pro 订阅用 StoreKit 2；有考试倒计时小组件`,`考试模式保持屏幕常亮，像真实考试一样分部分计时；中途退出不丢作答`,`AI 起草的题目必须经过两个模型交叉检查；流水线会拦下使用权不明的素材`,`Go 后端使用 pgx 和 goose，约 13,000 行；内容包导出到 Cloudflare R2`,`Android 版用 Jetpack Compose 编写，约 18,000 行 Kotlin`],tieu:[`Flutter 与 Provider，约 20,000 行 Dart，分 10 个模块`,`词典存于 SQLCipher AES-256；音频用 AES-GCM 加密，封装在自定义的 KXA1 容器中，文件名作为 AAD 绑定`,`一把主密钥拆成两份 XOR 分片；HKDF-SHA256 分别派生数据库密钥和音频密钥`,`五步 Python 流水线：原始数据 → 语法 → 对话 → SQLite → 加密；这是上架构建的唯一路径`,`安全审计脚本会打开构建好的 IPA/AAB，发现未加密的 SQLite 或 MP3 就阻止发布`,`社区功能用 Supabase；OTA 内容包通过 10 分钟有效期的签名链接下发`],meal:[`Flutter 与 GetX，离线数据存于 sqflite`,`直接使用 StoreKit 2，不用 RevenueCat：应用把 Apple 的 JWS 发到 Cloudflare Worker，Worker 用 Apple 根证书校验后才记账`,`交易账本和 AI 额度存在 D1，配额存在 KV；D1 确认之后交易才算完成`,`AI 额度在服务端预留，只有操作成功才扣除；离线流程永远不消耗额度`,`正式版若缺少代理配置，支付会关闭，但全部离线功能照常可用`,`release_audit 脚本跑 12 道关卡：静态分析、单元测试、离线数据、代理冒烟测试、隐私清单、商店元数据`],drop:[`Flutter 与 GetX：193 个 Dart 文件，约 45,000 行，31 个页面`,`Firebase Auth（Google、Apple）、Firestore（规则和索引随仓库提交）、App Check、Crashlytics`,`独立的 Python 媒体后端部署在 Render，用 Firebase ID token 鉴权，单次上传上限 15 MB`,`用 Fastlane 以代码方式在 Play Console 创建内购商品和分国家定价，而不是手动点`,`Repository 返回 Result/Failure，而不是抛异常`,`打卡照片在设备上压缩；私密分享通过二维码完成`],pea:[`SwiftUI，约 12,000 行 Swift；用 XcodeGen 生成含 7 个 target 的工程`,`四个 App Extension：DeviceActivityMonitor、ShieldConfiguration、ShieldAction 和 Widget（WidgetKit + Live Activity）`,`屏蔽会启用两次——应用内一次、扩展内一次——因为 intervalDidStart 可能延迟数秒`,`共享状态走 App Group 加 JSON，不用 CoreData，因为扩展只有约 6 MB 内存`,`Go 后端只用 net/http 和纯 Go 的 SQLite，一个约 15 MB 的镜像跑在 Fly.io`,`用标准库自行校验 App Store Server Notifications v2；时钟跳动超过 5 分钟即判定专注会话中断`,`同 bundle id 的「仅计时」target，不需要 Family Controls 权限——让 1.0 按时上架的备用方案`,`Focus Duo 用 8 位邀请码配对；加入接口按 IP 限制每分钟 20 次尝试`],nuni:[`Go 1.26，chi 与 pgx 配合 PostgreSQL，约 30,000 行，20 多个 goose 迁移`,`网页端 Next.js 16 与 React 19，56 个路由；Flutter 应用基于 flutter_bloc，约 45,000 行`,`复习调度用 FSRS 而非 SM-2；CAS 式自动保存加幂等提交，并有模拟双设备的端到端脚本`,`设计令牌和资源同时生成到 React 和 Dart，校验步骤在两边不一致时直接失败`,`每个版本附带 verification.json，记录测试日志和构建哈希`,`Prometheus 负责指标，MinIO 负责文件，Firebase Admin 负责鉴权`],crab:[`Node/Express 配 MongoDB；JWT 加按设备轮换的 key-token 表`,`营业日按越南时间早上 6 点到次日 6 点计算，所有报表统一遵守`,`任何删除操作前都会在 MongoDB 侧自动备份；基础参照表永远不可删除`,`独立的 analytics 模块从同一数据库生成 HTML、Excel 和 Word 报表`,`两个基于 GetX 的 Flutter 应用：一个给称重员，一个给老板`]}},xp={vi:{label:`Cách tôi làm`,title:`Vài quyết định kỹ thuật tôi *thấy đáng kể*.`,intro:`Mỗi dòng dưới đây là một thứ có thật trong mã nguồn, không phải khẩu hiệu.`,notes:[`Hai app tiếng Nhật dùng chung một Swift package cho nội dung, đồng bộ và lịch ôn FSRS.`,`Câu hỏi AI soạn chỉ được xuất bản sau khi hai mô hình khác nhau cùng kiểm tra.`,`Học, mua và mở khoá không bao giờ phải chờ server; mất mạng vẫn làm đề được.`,`Từ điển trong SQLCipher AES-256; âm thanh AES-GCM, tên file ràng buộc làm AAD.`,`Khoá gốc tách hai mảnh XOR; HKDF sinh khoá riêng cho dữ liệu và âm thanh.`,`Build phát hành tự thất bại nếu còn SQLite hay MP3 chưa mã hoá trong IPA.`,`Chuỗi chứng chỉ JWS của Apple xác thực bằng thư viện chuẩn Go, không thêm dependency.`,`Shield của Screen Time bật hai lần, trong app và từ extension, để không lỡ giây nào.`,`Extension chặn app giữ dưới 6 MB: không StoreKit, không quảng cáo, không mạng.`,`Biên nhận StoreKit 2 được Worker xác thực, ghi sổ D1, rồi mới kết thúc giao dịch.`,`Tín dụng AI giữ chỗ phía server, chỉ trừ khi thao tác thành công.`,`Lịch ôn tập FSRS viết bằng Go; autosave kiểu CAS giữ hai thiết bị nhất quán.`,`Design token sinh ra cho cả React lẫn Dart; CI thất bại nếu hai bên lệch.`,`Fastlane tạo sản phẩm IAP và giá theo quốc gia trên Play Console bằng code.`],toolsLabel:`Bộ công cụ`,tools:[[`Mobile`,`SwiftUI, Flutter (GetX, Provider, BLoC), Jetpack Compose, WidgetKit, Screen Time API`],[`Backend`,`Go (net/http, chi, pgx), Node/Express, Cloudflare Workers`],[`Dữ liệu`,`PostgreSQL, SQLite (GRDB, SQLCipher), Firestore, Supabase, MongoDB, D1/KV, R2`],[`Thanh toán`,`StoreKit 2, App Store Server Notifications v2, Google Play Billing`],[`Phát hành`,`XcodeGen, Fastlane, script kiểm tra tự viết, Fly.io, Render, Docker`]]},en:{label:`How I build`,title:`A few engineering decisions *I stand behind*.`,intro:`Every line below is something real in the source, not a slogan.`,notes:[`Two Japanese apps share one Swift package for content, sync and FSRS reviews.`,`AI-drafted questions are published only after two different models have checked them.`,`Studying, buying and unlocking never wait on a server; tests work offline.`,`Dictionary in SQLCipher AES-256; audio in AES-GCM with the filename bound as AAD.`,`Master key split into two XOR shares; HKDF derives separate data and audio keys.`,`The release build fails if unencrypted SQLite or MP3 survives in the IPA.`,`Apple's JWS certificate chain verified with the Go standard library, no extra dependency.`,`The Screen Time shield is armed twice, in-app and from the extension, so no second is lost.`,`The blocking extension stays under 6 MB: no StoreKit, no ads, no networking.`,`StoreKit 2 receipts are verified by a Worker and written to D1 before the transaction finishes.`,`AI credits are reserved server-side and charged only when the action succeeds.`,`FSRS scheduling in Go; CAS autosave keeps two devices consistent.`,`Design tokens generated into both React and Dart; CI fails on drift.`,`Fastlane provisions Play Console IAP products and per-country prices from code.`],toolsLabel:`Toolbox`,tools:[[`Mobile`,`SwiftUI, Flutter (GetX, Provider, BLoC), Jetpack Compose, WidgetKit, Screen Time API`],[`Backend`,`Go (net/http, chi, pgx), Node/Express, Cloudflare Workers`],[`Data`,`PostgreSQL, SQLite (GRDB, SQLCipher), Firestore, Supabase, MongoDB, D1/KV, R2`],[`Payments`,`StoreKit 2, App Store Server Notifications v2, Google Play Billing`],[`Release`,`XcodeGen, Fastlane, hand-written audit scripts, Fly.io, Render, Docker`]]},zh:{label:`我怎么做`,title:`几个我*站得住脚*的技术决定。`,intro:`下面每一条都真实存在于代码里，不是口号。`,notes:[`两款日语应用共用一个 Swift package，负责内容、同步和 FSRS 复习。`,`AI 起草的题目，必须经过两个不同模型检查后才会发布。`,`学习、购买和解锁从不等待服务器；断网也能做题。`,`词典存于 SQLCipher AES-256；音频用 AES-GCM，文件名作为 AAD 绑定。`,`主密钥拆成两份 XOR 分片；HKDF 分别派生数据密钥和音频密钥。`,`IPA 里若残留未加密的 SQLite 或 MP3，发布构建直接失败。`,`用 Go 标准库校验 Apple 的 JWS 证书链，不引入额外依赖。`,`Screen Time 屏蔽启用两次——应用内和扩展内——一秒都不漏。`,`屏蔽扩展保持在 6 MB 以下：没有 StoreKit，没有广告，没有网络。`,`StoreKit 2 收据先由 Worker 校验并写入 D1，交易才算完成。`,`AI 额度在服务端预留，只有操作成功才扣除。`,`用 Go 实现 FSRS 复习调度；CAS 式自动保存让两台设备保持一致。`,`设计令牌同时生成到 React 和 Dart；两边不一致则 CI 失败。`,`用 Fastlane 以代码方式在 Play Console 创建内购商品和分国家定价。`],toolsLabel:`工具箱`,tools:[[`移动端`,`SwiftUI、Flutter（GetX、Provider、BLoC）、Jetpack Compose、WidgetKit、Screen Time API`],[`后端`,`Go（net/http、chi、pgx）、Node/Express、Cloudflare Workers`],[`数据`,`PostgreSQL、SQLite（GRDB、SQLCipher）、Firestore、Supabase、MongoDB、D1/KV、R2`],[`支付`,`StoreKit 2、App Store Server Notifications v2、Google Play Billing`],[`发布`,`XcodeGen、Fastlane、自写审计脚本、Fly.io、Render、Docker`]]}},Sp={vi:{caption:`Đà Nẵng, 2026`,techLabel:`Kỹ thuật`},en:{caption:`Da Nang, 2026`,techLabel:`Under the hood`},zh:{caption:`岘港，2026`,techLabel:`技术细节`}},Cp=[{jp:`あそこ`,romaji:`asoko`,vi:`ở đó`,en:`there`,zh:`那里`},{jp:`人`,romaji:`hito`,vi:`người`,en:`person`,zh:`人`},{jp:`こんにちは`,romaji:`konnichiwa`,vi:`xin chào`,en:`hello`,zh:`你好`}],wp={vi:{label:`Hiyoko · thử lật thẻ`,tap:`chạm để lật`,no:`Chưa nhớ`,yes:`Nhớ rồi`,done:`Xong vòng!`,again:`Chơi lại`},en:{label:`Hiyoko · try a card`,tap:`tap to flip`,no:`Not yet`,yes:`Got it`,done:`Round done!`,again:`Again`},zh:{label:`Hiyoko · 试试翻卡`,tap:`点击翻转`,no:`还没记住`,yes:`记住了`,done:`本轮完成！`,again:`再来一次`}},Tp=`#3A2414`,Ep=`#B4412E`,Dp=`#FFF8EC`,Op={type:`spring`,stiffness:260,damping:24},kp={touchAction:`manipulation`,userSelect:`none`},Ap={backfaceVisibility:`hidden`,WebkitBackfaceVisibility:`hidden`};function jp({mood:e,size:t,reduce:n}){return(0,H.jsx)(X.div,{animate:n?void 0:{y:[0,-6,0]},transition:{duration:3,repeat:1/0,ease:`easeInOut`},style:{width:t,pointerEvents:`none`},children:(0,H.jsx)(X.img,{src:`assets/demo/hiyo-${e}.png`,alt:``,draggable:!1,initial:!n&&{scale:.85},animate:{scale:1},transition:Op,style:{width:`100%`,height:`auto`,display:`block`,userSelect:`none`,WebkitUserSelect:`none`}},e)})}function Mp({lang:e,touch:t,reduce:n}){let r=wp[e],[i,a]=(0,_.useState)(0),[o,s]=(0,_.useState) .p3d-stage{--t:9px;--pw:var(--w,240px);position:relative;display:grid;place-items:center;height:min(640px,80svh);perspective:1400px;perspective-origin:50% 35%;view-timeline:--p3d block}
.p3d-shadow{position:absolute;left:50%;top:calc(50% + var(--pw) * 1.0867 - 6px);width:calc(var(--pw) * 1.15);height:calc(var(--pw) * .16);translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.42),rgba(0,0,0,.18) 55%,transparent);pointer-events:none}
.p3d-phone{position:relative;width:var(--pw);aspect-ratio:600/1304;transform-style:preserve-3d;transform:rotateX(8deg) rotateY(-18deg);will-change:transform}
.p3d-edge{position:absolute;--a:90deg;background:linear-gradient(var(--a),#2e2e32,#d4d4da 28%,#77777e 52%,#ececf0 74%,#3a3a3f);border-radius:4px}
.p3d-edge.l,.p3d-edge.r{top:24px;bottom:24px;width:var(--t)}
.p3d-edge.t,.p3d-edge.b{left:24px;right:24px;height:var(--t);--a:180deg}
.p3d-edge.l{left:calc(var(--t) / -2);transform:rotateY(-90deg)}
.p3d-edge.r{right:calc(var(--t) / -2);transform:rotateY(90deg)}
.p3d-edge.t{top:calc(var(--t) / -2);transform:rotateX(90deg)}
.p3d-edge.b{bottom:calc(var(--t) / -2);transform:rotateX(-90deg)}
.p3d-front{position:absolute;inset:0;box-sizing:border-box;padding:7px;border-radius:38px;background:#0c0c0d;transform:translateZ(calc(var(--t) / 2));backface-visibility:hidden;box-shadow:0 0 0 1.5px #9a9aa1,0 0 0 2.5px #2a2a2e,inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 3px #000}

.p3d-screen img{display:block;width:100%;height:100%;object-fit:cover}
.p3d-island{position:absolute;top:calc(var(--pw) * .035);left:50%;width:32%;aspect-ratio:126/37;translate:-50% 0;border-radius:999px;background:#000}
.p3d-glare{position:absolute;inset:0 -50%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.2) 50%,transparent 62%);pointer-events:none}
@supports (animation-timeline: view()){@media (prefers-reduced-motion: no-preference){
.p3d-phone{animation:p3d-tilt linear both;animation-timeline:--p3d;animation-range:cover 10% cover 90%}
.p3d-glare{animation:p3d-sweep linear both;animation-timeline:--p3d}
.p3d-shadow{animation:p3d-squash linear both;animation-timeline:--p3d}
